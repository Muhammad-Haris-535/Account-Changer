<!-- popup.html -->

<!DOCTYPE html>
<html>
<head>
  <style>
    body{
      width:220px;
      padding:15px;
      background:#111827;
      font-family:Arial;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      color:white;
      font-weight:bold;
    }

    #exportBtn{
      background:#2563eb;
    }

    #importBtn{
      background:#10b981;
    }

    input{
      display:none;
    }
  </style>
</head>
<body>

  <button id="exportBtn">Export</button>

  <button id="importBtn">Import</button>

  <input type="file" id="fileInput" accept=".json" />

  <script src="popup.js"></script>
</body>
</html>
