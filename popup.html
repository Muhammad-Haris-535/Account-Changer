<!-- popup.html -->

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.35), transparent 35%),
        linear-gradient(135deg, #0f172a, #111827);
      color: #ffffff;
    }

    .card {
      padding: 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(14px);
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      color: #93c5fd;
      background: rgba(37, 99, 235, 0.18);
      border: 1px solid rgba(147, 197, 253, 0.25);
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -0.5px;
    }

    p {
      margin: 7px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 13px;
      cursor: pointer;
      color: white;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.2px;
      transition: all 0.2s ease;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(0);
      scale: 0.98;
    }

    #exportBtn {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    #importBtn {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .author-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .author-name {
      font-size: 12px;
      color: #e5e7eb;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .linkedin-link {
      display: inline-block;
      font-size: 12px;
      color: #93c5fd;
      text-decoration: none;
      font-weight: bold;
    }

    .linkedin-link:hover {
      color: #bfdbfe;
      text-decoration: underline;
    }

    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }

    input {
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <span class="badge">Account Changer</span>
      <h2>Import / Export</h2>
      <p>Securely export or import your browser cookie JSON file.</p>
    </div>

    <div class="actions">
      <button id="exportBtn">Export Cookies</button>
      <button id="importBtn">Import Cookies</button>
    </div>

    <div class="author-box">
      <div class="author-name">Developed by Muhammad Haris</div>
      <a
        class="linkedin-link"
        href="https://www.linkedin.com/in/muhammad-haris-dev"
        target="_blank"
      >
        View on Linkedin
      </a>
    </div>

    <div class="footer">
      Premium Extension Tool
    </div>

    <input type="file" id="fileInput" accept=".json" />
  </div>

  <script src="popup.js"></script>
</body>
</html>
