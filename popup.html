<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="card">
    <div class="header">
      <span class="badge">Account Changer</span>
      <h2>Import / Export</h2>
      <p>Securely export or import your browser cookie JSON file.</p>
    </div>

    <div class="actions">
      <button id="exportBtn">Export Cookies</button>
      <button id="importBtn">Import Cookies</button>
    </div>

    <div id="messageBox"></div>

    <div class="author-box">
      <div class="author-name">Developed by Muhammad Haris</div>
      <a
        class="linkedin-link"
        href="https://www.linkedin.com/in/muhammad-haris-dev"
        target="_blank"
      >
        View on Linkedin
      </a>
    </div>

    <div class="footer">
      Premium Extension Tool
    </div>

    <input type="file" id="fileInput" accept=".json" />
  </div>

  <script src="popup.js"></script>
</body>
</html>
